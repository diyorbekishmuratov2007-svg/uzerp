version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uzerp-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uzerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uzerp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-uzerp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-uzerp}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uzerp-network

  redis:
    image: redis:7-alpine
    container_name: uzerp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uzerp-network

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: uzerp-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-uzerp}:${POSTGRES_PASSWORD:-uzerp_secret}@postgres:5432/${POSTGRES_DB:-uzerp}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      API_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uzerp-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: uzerp-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001/api
      NEXT_PUBLIC_APP_NAME: UzERP
      NEXT_PUBLIC_DEFAULT_LOCALE: uz
    depends_on:
      - api
    networks:
      - uzerp-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  uzerp-network:
    driver: bridge
